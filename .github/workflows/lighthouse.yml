name: Lighthouse

# Accessibility gate for the marketing site.
#
# Runs on every pull request into main, BEFORE Netlify auto-deploys main, so
# results can be reviewed before anything goes live. The accessibility category
# is a hard gate (see lighthouserc.js: categories:accessibility error >= 0.90).
# Performance, best practices, and SEO are reported but never block the merge.
#
# After this workflow has run once on a PR, make the job below a required status
# check: Settings -> Branches -> branch protection rule for `main` -> Require
# status checks to pass -> add "Lighthouse accessibility gate". Until then a red
# check is visible but does not block merge.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write # allow Lighthouse CI to post commit status checks
  pull-requests: write # allow the summary-comment step to post/update a PR comment

jobs:
  lighthouse:
    name: Lighthouse accessibility gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Collect Lighthouse results (3 runs, median)
        # staticDistDir, numberOfRuns, and the desktop settings all come from
        # lighthouserc.js. ubuntu-latest ships with Google Chrome, which LHCI
        # finds automatically.
        run: lhci collect

      - name: Check assertions (accessibility gate)
        id: assert
        # Do not fail the job here. We still want the report artifact and the PR
        # comment to be produced. The final step re-raises the failure so the
        # check goes red when accessibility is below 0.90.
        continue-on-error: true
        run: lhci assert

      - name: Write HTML and JSON reports to disk
        if: always()
        run: lhci upload --target=filesystem --outputDir=.lighthouseci/report

      - name: Upload the full report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/report
          if-no-files-found: warn

      - name: Publish public report link and Lighthouse status checks
        if: always()
        # Never let a publishing hiccup fail the build. The gate is enforced by
        # the final step, not by this upload.
        continue-on-error: true
        run: lhci upload --target=temporary-public-storage
        env:
          # Uses the built-in Actions token so Lighthouse CI can post commit
          # status checks. If you install the Lighthouse CI GitHub App, add its
          # token as the LHCI_GITHUB_APP_TOKEN secret and it is used instead.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment the four category scores on the PR
        # Skips automatically on fork PRs, where the token is read-only.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifestPath = '.lighthouseci/report/manifest.json';
            if (!fs.existsSync(manifestPath)) {
              core.info('No Lighthouse manifest found. Skipping PR comment.');
              return;
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const run = manifest.find((r) => r.isRepresentativeRun) || manifest[0];
            if (!run || !run.summary) {
              core.info('No representative run in manifest. Skipping PR comment.');
              return;
            }
            const s = run.summary;
            const pct = (v) => Math.round(v * 100);
            const gate = s.accessibility >= 0.9 ? 'PASS' : 'FAIL';
            const marker = '<!-- lighthouse-a11y-gate -->';
            const body = [
              marker,
              '## Lighthouse results (desktop, median of 3 runs)',
              '',
              '| Category | Score | Role |',
              '| --- | --- | --- |',
              `| Accessibility | ${pct(s.accessibility)} / 100 | Gate: ${gate} (must be at least 90) |`,
              `| Performance | ${pct(s.performance)} / 100 | Informational |`,
              `| Best Practices | ${pct(s['best-practices'])} / 100 | Informational |`,
              `| SEO | ${pct(s.seo)} / 100 | Informational |`,
              '',
              'Only accessibility blocks merge. Download the **lighthouse-report** artifact from this workflow run for the full HTML report.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce the accessibility gate
        # Re-raise the assertion failure so the check goes red and, once made a
        # required status check, blocks merge.
        if: steps.assert.outcome == 'failure'
        run: |
          echo "::error::Accessibility score is below 0.90. Download the 'lighthouse-report' artifact for the failing audits."
          exit 1
