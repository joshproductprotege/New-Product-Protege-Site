# Static site: no framework build. Stage only the public site files into _site
# so internal material (CLAUDE.md, docs/, changelogs) never reaches the live site.
[build]
  command = "mkdir -p _site && cp index.html _site/ && cp -r assets _site/"
  publish = "_site"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
